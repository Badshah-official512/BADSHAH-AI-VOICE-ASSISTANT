name: Rename site APK to BADSHAH-AI.apk (v7.5.1)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace site APK with v7.5.1 build
        run: |
          set -e
          ls -l website-v4/
          test -f website-v4/BADSHAH-AI-v7.5.1.apk
          test "$(stat -c%s website-v4/BADSHAH-AI-v7.5.1.apk)" = "3914873"
          test "$(sha256sum website-v4/BADSHAH-AI-v7.5.1.apk | cut -d' ' -f1)" = "47760ae17009eab28aeef8db3d3b529098507a66a49dc550ad6962f6192b3d36"
          rm website-v4/BADSHAH-AI.apk
          git mv website-v4/BADSHAH-AI-v7.5.1.apk website-v4/BADSHAH-AI.apk
          test "$(stat -c%s website-v4/BADSHAH-AI.apk)" = "3914873"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git commit -m "Site APK v7.5.1 (code 24)"
          git push
