name: Rename site APK to BADSHAH-AI.apk

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename site APK
        run: |
          git config user.name "Badshah-official512"
          git config user.email "Badshah-official512@users.noreply.github.com"
          git mv website-v4/BADSHAH-AI-v7.5.0.apk website-v4/BADSHAH-AI.apk
          git commit -m "Site APK v7.5.0 (code 23)"
          git push
