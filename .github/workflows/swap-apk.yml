name: swap-apk
on: workflow_dispatch
permissions:
  contents: write
jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "badshah-bot"
          git config user.email "badshah-bot@users.noreply.github.com"
          git rm -q website-v4/BADSHAH-AI.apk
          git mv website-v4/BADSHAH-AI-v7.7.1.apk website-v4/BADSHAH-AI.apk
          git commit -m "Site APK v7.7.1 (code 26)"
          git push
